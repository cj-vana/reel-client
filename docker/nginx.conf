worker_processes 2;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 1024; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    sendfile on;
    keepalive_timeout 30;
    client_max_body_size 1k;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    log_format static '$remote_addr [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent';
    access_log /dev/stdout static;
    gzip on;
    gzip_types text/css application/javascript text/javascript application/json image/svg+xml;
    gzip_vary on;

    map $uri $reel_cache_control {
        default "no-cache";
        /index.html "no-store";
        /reel-config.js "no-store";
        /reel-sw.js "no-cache";
        /manifest.webmanifest "no-cache";
        ~^/assets/ "public, max-age=31536000, immutable";
    }

    server {
        listen 8080;
        absolute_redirect off;
        root /usr/share/nginx/html;
        index index.html;
        add_header Cache-Control $reel_cache_control;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;

        if ($request_method !~ ^(GET|HEAD)$) { return 405; }

        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }
        location ^~ /assets/ { try_files $uri =404; }
        location ^~ /brand/ { try_files $uri =404; }
        location = /manifest.webmanifest { default_type application/manifest+json; try_files $uri =404; }
        location = /reel-sw.js { default_type text/javascript; try_files $uri =404; }
        location ~ (^|/)\. { return 404; }
        location ~ \.[^/]+$ { try_files $uri =404; }
        location / { try_files $uri $uri/ @app; }
        location @app { return 302 /; }
    }
}
