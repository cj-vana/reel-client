name: Verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      native_ui:
        description: Native UI journeys to run on simulators
        type: choice
        options: [none, ios, tvos, both]
        default: none
      ios_device:
        description: Simulator for the iOS UI journeys
        type: choice
        options: [iphone, ipad]
        default: iphone
      only_testing:
        description: UI tests to run, comma separated, e.g. ReelTVUITests/TVJourneys/testRemoteSignInHomeDetailsAndBack (empty runs the default set)
        type: string
        required: false
        default: ''

permissions:
  contents: read

# Manual runs get their own group so they never cancel each other and pushes
# cannot cancel them. Push and pull request runs still replace older ones.
concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && format('verify-dispatch-{0}', github.run_id) || format('verify-{0}-{1}', github.workflow, github.ref) }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  # Pull requests skip app jobs their changes cannot affect. Pushes to main and manual runs test
  # everything, and any path outside a known app folder selects everything too.
  changes:
    name: Changed areas
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      apple: ${{ steps.areas.outputs.apple }}
      web: ${{ steps.areas.outputs.web }}
      roku: ${{ steps.areas.outputs.roku }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: areas
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
        # No pipes: a failure here must fail the step, never leave the outputs empty.
        run: |
          if [ "$EVENT" = pull_request ]; then
            git diff --name-only "$BASE...HEAD" > "$RUNNER_TEMP/changed.txt"
            python3 -B scripts/ci-changed-areas.py < "$RUNNER_TEMP/changed.txt" > "$RUNNER_TEMP/areas.txt"
          else
            python3 -B scripts/ci-changed-areas.py --all > "$RUNNER_TEMP/areas.txt"
          fi
          cat "$RUNNER_TEMP/areas.txt" >> "$GITHUB_OUTPUT"
          cat "$RUNNER_TEMP/areas.txt"

  workflows:
    name: Workflow lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Go verifies the module against its checksum database; shellcheck comes with the runner.
      - run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - run: |
          "$(go env GOPATH)/bin/actionlint" -color

  source-checks:
    name: Privacy scan and Python tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: apps/apple/qa/requirements.txt
      - name: Install ffmpeg
        timeout-minutes: 10
        run: |
          for _ in 1 2 3; do
            sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update &&
              sudo apt-get -o Acquire::http::Timeout=30 install -y --no-install-recommends ffmpeg lsof && exit 0
            sleep 15
          done
          exit 1
      - run: python -m pip install -r apps/apple/qa/requirements.txt
      - run: python scripts/check-public-source.py
      - run: python scripts/check-doc-links.py
      - run: python -m unittest discover -s scripts -p 'test_*.py'
      - name: Generate fixtures, then scan again so generated files stay ignored
        run: |
          python apps/apple/qa/prepare_synthetic_fixtures.py
          python scripts/check-public-source.py
      - run: python -m unittest discover -s apps/apple/qa -p 'test_*.py'
      - run: python -m unittest discover -s apps/tvos/qa -p 'test_*.py'
      - run: python -m unittest discover -s apps/web/tests -p '*_test.py'

  web:
    name: Web
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      REEL_CI_SYNTHETIC: '1'
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm test
      - run: npm run check:static
      - run: npm run webos:stage
      - run: npm exec --yes --package=@webos-tools/cli@3.2.6 -- ares-package --no-minify webos-package --outdir .cache/packages
      - run: python3 scripts/inspect-webos.py
      # A stalled package mirror once held this step for the whole job; bound each attempt and retry.
      - name: Install ffmpeg
        timeout-minutes: 10
        run: |
          for _ in 1 2 3; do
            sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update &&
              sudo apt-get -o Acquire::http::Timeout=30 install -y --no-install-recommends ffmpeg lsof && exit 0
            sleep 15
          done
          exit 1
      - run: node node_modules/playwright/cli.js install --with-deps chrome
        timeout-minutes: 10
      - run: npm run qa:prepare
      - name: Browser suite
        run: node ../../scripts/run-web-browser-suite.mjs
      - name: Keep failure screenshots
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-failures
          path: apps/web/test-results/**/test-failed-*.png
          if-no-files-found: warn
          retention-days: 3

  desktop:
    name: Desktop
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm test
      - run: npm run build

  tizen:
    name: Samsung TV
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            apps/web/package-lock.json
            apps/tizen/package-lock.json
      - name: Stage the shared TV payload
        working-directory: apps/web
        run: |
          npm ci --ignore-scripts
          npm run webos:stage
      - working-directory: apps/tizen
        run: |
          npm ci --ignore-scripts
          npm test
          python3 -B tests/source-policy.py
          npm run build -- --web-root ../web
          npm run package

  roku:
    name: Roku
    needs: changes
    if: needs.changes.outputs.roku == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/roku
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/roku/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm test

  docker:
    name: Docker image
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: docker compose -p reel -f docker/compose.yml up --build -d --wait
      - run: python3 docker/verify-http.py
      - name: Check the release compose file, with the updater
        run: docker compose -p reel -f docker/compose.release.yml --profile auto-update config --quiet
      - if: always()
        run: docker compose -p reel -f docker/compose.yml down

  ios:
    name: iOS
    needs: changes
    if: needs.changes.outputs.apple == 'true'
    runs-on: xcode-27
    timeout-minutes: 90
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: apps/apple/qa/requirements.txt
      - run: brew install xcodegen ffmpeg
      - run: python -m pip install -r apps/apple/qa/requirements.txt
      - run: xcodegen generate
        working-directory: apps/apple
      - name: Build for the simulator
        run: python scripts/ci-xcode.py ios build
      - name: Unit tests on a new simulator with ad hoc signing and fixtures
        run: python scripts/ci-xcode.py ios test --output-dir "$RUNNER_TEMP/reel-ci/ios-test"
      - name: Remove the test simulator and fixtures
        if: always()
        run: python scripts/ci-xcode.py ios cleanup --output-dir "$RUNNER_TEMP/reel-ci/ios-test"
      - name: Keep results after a failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-unit-results
          path: |
            ${{ runner.temp }}/reel-ci/ios-test/results
            ${{ runner.temp }}/reel-ci/ios-test/logs
          if-no-files-found: warn
          retention-days: 3

  tvos:
    name: tvOS
    needs: changes
    if: needs.changes.outputs.apple == 'true'
    runs-on: xcode-27
    timeout-minutes: 90
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: apps/apple/qa/requirements.txt
      - run: brew install xcodegen ffmpeg
      - run: python -m pip install -r apps/apple/qa/requirements.txt
      - run: xcodegen generate
        working-directory: apps/tvos
      - name: Build for the simulator
        run: python scripts/ci-xcode.py tvos build
      - name: Unit tests on a new simulator with ad hoc signing and fixtures
        run: python scripts/ci-xcode.py tvos test --output-dir "$RUNNER_TEMP/reel-ci/tvos-test"
      - name: Remove the test simulator and fixtures
        if: always()
        run: python scripts/ci-xcode.py tvos cleanup --output-dir "$RUNNER_TEMP/reel-ci/tvos-test"
      - name: Keep results after a failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tvos-unit-results
          path: |
            ${{ runner.temp }}/reel-ci/tvos-test/results
            ${{ runner.temp }}/reel-ci/tvos-test/logs
          if-no-files-found: warn
          retention-days: 3

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Refuses a pull request that adds a dependency with a known high or critical vulnerability.
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high

  # The one check branch protection requires. It passes only when every job above passed, or was
  # skipped because the change could not affect it.
  result:
    name: CI result
    if: always()
    needs: [changes, workflows, source-checks, web, desktop, tizen, roku, docker, ios, tvos, dependency-review]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Every job passed or was skipped as unaffected
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          jq -r '"| Job | Result |", "|---|---|", (to_entries[] | "| \(.key) | \(.value.result) |")' <<< "$NEEDS" >> "$GITHUB_STEP_SUMMARY"
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<< "$NEEDS"
          jq -e '
            .changes.result == "success" and .workflows.result == "success" and .["source-checks"].result == "success"
            and ([.changes.outputs.apple, .changes.outputs.web, .changes.outputs.roku] | all(. == "true" or . == "false"))
            and (to_entries | all(.value.result == "success" or .value.result == "skipped"))
          ' <<< "$NEEDS" > /dev/null

  ios-ui:
    name: iOS UI journeys
    if: github.event_name == 'workflow_dispatch' && (inputs.native_ui == 'ios' || inputs.native_ui == 'both')
    runs-on: xcode-27
    timeout-minutes: 300
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
      PYTHONDONTWRITEBYTECODE: '1'
      IOS_DEVICE: ${{ inputs.ios_device }}
      ONLY_TESTING: ${{ inputs.only_testing }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: apps/apple/qa/requirements.txt
      - run: brew install xcodegen ffmpeg
      - run: python -m pip install -r apps/apple/qa/requirements.txt
      - run: xcodegen generate
        working-directory: apps/apple
      - name: UI journeys on a new simulator
        run: python scripts/ci-xcode.py ios ui --device "$IOS_DEVICE" --only-testing "$ONLY_TESTING" --output-dir "$RUNNER_TEMP/reel-ci/ios-ui"
      - name: Remove the test simulator and fixtures
        if: always()
        run: python scripts/ci-xcode.py ios cleanup --output-dir "$RUNNER_TEMP/reel-ci/ios-ui"
      - name: Keep results after a failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-ui-results
          path: |
            ${{ runner.temp }}/reel-ci/ios-ui/results
            ${{ runner.temp }}/reel-ci/ios-ui/logs
          if-no-files-found: warn
          retention-days: 3
      - name: Keep screen tour images
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-screen-tour-${{ inputs.ios_device }}
          path: ${{ runner.temp }}/reel-ci/ios-ui/results/*-tour/*.png
          if-no-files-found: ignore
          retention-days: 3

  tvos-ui:
    name: tvOS UI journeys
    if: github.event_name == 'workflow_dispatch' && (inputs.native_ui == 'tvos' || inputs.native_ui == 'both')
    runs-on: xcode-27
    timeout-minutes: 300
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
      PYTHONDONTWRITEBYTECODE: '1'
      ONLY_TESTING: ${{ inputs.only_testing }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: apps/apple/qa/requirements.txt
      - run: brew install xcodegen ffmpeg
      - run: python -m pip install -r apps/apple/qa/requirements.txt
      - run: xcodegen generate
        working-directory: apps/tvos
      - name: UI journeys on a new simulator
        run: python scripts/ci-xcode.py tvos ui --only-testing "$ONLY_TESTING" --output-dir "$RUNNER_TEMP/reel-ci/tvos-ui"
      - name: Remove the test simulator and fixtures
        if: always()
        run: python scripts/ci-xcode.py tvos cleanup --output-dir "$RUNNER_TEMP/reel-ci/tvos-ui"
      - name: Keep results after a failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tvos-ui-results
          path: |
            ${{ runner.temp }}/reel-ci/tvos-ui/results
            ${{ runner.temp }}/reel-ci/tvos-ui/logs
          if-no-files-found: warn
          retention-days: 3
