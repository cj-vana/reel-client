name: Verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      native_ui:
        description: Native UI journeys to run on simulators
        type: choice
        options: [none, ios, tvos, both]
        default: none
      ios_device:
        description: Simulator for the iOS UI journeys
        type: choice
        options: [iphone, ipad]
        default: iphone
      only_testing:
        description: UI tests to run, comma separated, e.g. ReelTVUITests/TVJourneys/testRemoteSignInHomeDetailsAndBack (empty runs the default set)
        type: string
        required: false
        default: ''

permissions:
  contents: read

# Manual runs get their own group so they never cancel each other and pushes
# cannot cancel them. Push and pull request runs still replace older ones.
concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && format('verify-dispatch-{0}', github.run_id) || format('verify-{0}-{1}', github.workflow, github.ref) }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  source-checks:
    name: Privacy scan and Python tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: apps/apple/qa/requirements.txt
      - name: Install ffmpeg
        timeout-minutes: 10
        run: |
          for _ in 1 2 3; do
            sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update &&
              sudo apt-get -o Acquire::http::Timeout=30 install -y --no-install-recommends ffmpeg lsof && exit 0
            sleep 15
          done
          exit 1
      - run: python -m pip install -r apps/apple/qa/requirements.txt
      - run: python scripts/check-public-source.py
      - run: python scripts/check-doc-links.py
      - run: python -m unittest discover -s scripts -p 'test_*.py'
      - name: Generate fixtures, then scan again so generated files stay ignored
        run: |
          python apps/apple/qa/prepare_synthetic_fixtures.py
          python scripts/check-public-source.py
      - run: python -m unittest discover -s apps/apple/qa -p 'test_*.py'
      - run: python -m unittest discover -s apps/tvos/qa -p 'test_*.py'
      - run: python -m unittest discover -s apps/web/tests -p '*_test.py'

  web:
    name: Web
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      REEL_CI_SYNTHETIC: '1'
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm test
      - run: npm run check:static
      - run: npm run webos:stage
      - run: npm exec --yes --package=@webos-tools/cli@3.2.6 -- ares-package --no-minify webos-package --outdir .cache/packages
      - run: python3 scripts/inspect-webos.py
      # A stalled package mirror once held this step for the whole job; bound each attempt and retry.
      - name: Install ffmpeg
        timeout-minutes: 10
        run: |
          for _ in 1 2 3; do
            sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update &&
              sudo apt-get -o Acquire::http::Timeout=30 install -y --no-install-recommends ffmpeg lsof && exit 0
            sleep 15
          done
          exit 1
      - run: node node_modules/playwright/cli.js install --with-deps chrome
        timeout-minutes: 10
      - run: npm run qa:prepare
      - name: Browser suite
        run: node ../../scripts/run-web-browser-suite.mjs
      - name: Keep failure screenshots
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-failures
          path: apps/web/test-results/**/test-failed-*.png
          if-no-files-found: warn
          retention-days: 3

  desktop:
    name: Desktop
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm test
      - run: npm run build

  tizen:
    name: Samsung TV
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Stage the shared TV payload
        working-directory: apps/web
        run: |
          npm ci --ignore-scripts
          npm run webos:stage
      - working-directory: apps/tizen
        run: |
          npm ci --ignore-scripts
          npm test
          python3 -B tests/source-policy.py
          npm run build -- --web-root ../web
          npm run package

  roku:
    name: Roku
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/roku
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/roku/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm test

  docker:
    name: Docker image
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: docker compose -p reel -f docker/compose.yml up --build -d --wait
      - run: python3 docker/verify-http.py
      - if: always()
        run: docker compose -p reel -f docker/compose.yml down

  ios:
    name: iOS
    runs-on: xcode-27
    timeout-minutes: 90
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: apps/apple/qa/requirements.txt
      - run: brew install xcodegen ffmpeg
      - run: python -m pip install -r apps/apple/qa/requirements.txt
      - run: xcodegen generate
        working-directory: apps/apple
      - name: Build for the simulator
        run: python scripts/ci-xcode.py ios build
      - name: Unit tests on a new simulator with ad hoc signing and fixtures
        run: python scripts/ci-xcode.py ios test --output-dir "$RUNNER_TEMP/reel-ci/ios-test"
      - name: Remove the test simulator and fixtures
        if: always()
        run: python scripts/ci-xcode.py ios cleanup --output-dir "$RUNNER_TEMP/reel-ci/ios-test"
      - name: Keep results after a failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-unit-results
          path: |
            ${{ runner.temp }}/reel-ci/ios-test/results
            ${{ runner.temp }}/reel-ci/ios-test/logs
          if-no-files-found: warn
          retention-days: 3

  tvos:
    name: tvOS
    runs-on: xcode-27
    timeout-minutes: 90
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: apps/apple/qa/requirements.txt
      - run: brew install xcodegen ffmpeg
      - run: python -m pip install -r apps/apple/qa/requirements.txt
      - run: xcodegen generate
        working-directory: apps/tvos
      - name: Build for the simulator
        run: python scripts/ci-xcode.py tvos build
      - name: Unit tests on a new simulator with ad hoc signing and fixtures
        run: python scripts/ci-xcode.py tvos test --output-dir "$RUNNER_TEMP/reel-ci/tvos-test"
      - name: Remove the test simulator and fixtures
        if: always()
        run: python scripts/ci-xcode.py tvos cleanup --output-dir "$RUNNER_TEMP/reel-ci/tvos-test"
      - name: Keep results after a failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tvos-unit-results
          path: |
            ${{ runner.temp }}/reel-ci/tvos-test/results
            ${{ runner.temp }}/reel-ci/tvos-test/logs
          if-no-files-found: warn
          retention-days: 3

  ios-ui:
    name: iOS UI journeys
    if: github.event_name == 'workflow_dispatch' && (inputs.native_ui == 'ios' || inputs.native_ui == 'both')
    runs-on: xcode-27
    timeout-minutes: 300
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
      PYTHONDONTWRITEBYTECODE: '1'
      IOS_DEVICE: ${{ inputs.ios_device }}
      ONLY_TESTING: ${{ inputs.only_testing }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: apps/apple/qa/requirements.txt
      - run: brew install xcodegen ffmpeg
      - run: python -m pip install -r apps/apple/qa/requirements.txt
      - run: xcodegen generate
        working-directory: apps/apple
      - name: UI journeys on a new simulator
        run: python scripts/ci-xcode.py ios ui --device "$IOS_DEVICE" --only-testing "$ONLY_TESTING" --output-dir "$RUNNER_TEMP/reel-ci/ios-ui"
      - name: Remove the test simulator and fixtures
        if: always()
        run: python scripts/ci-xcode.py ios cleanup --output-dir "$RUNNER_TEMP/reel-ci/ios-ui"
      - name: Keep results after a failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-ui-results
          path: |
            ${{ runner.temp }}/reel-ci/ios-ui/results
            ${{ runner.temp }}/reel-ci/ios-ui/logs
          if-no-files-found: warn
          retention-days: 3
      - name: Keep screen tour images
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-screen-tour-${{ inputs.ios_device }}
          path: ${{ runner.temp }}/reel-ci/ios-ui/results/*-tour/*.png
          if-no-files-found: ignore
          retention-days: 3

  tvos-ui:
    name: tvOS UI journeys
    if: github.event_name == 'workflow_dispatch' && (inputs.native_ui == 'tvos' || inputs.native_ui == 'both')
    runs-on: xcode-27
    timeout-minutes: 300
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
      PYTHONDONTWRITEBYTECODE: '1'
      ONLY_TESTING: ${{ inputs.only_testing }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: apps/apple/qa/requirements.txt
      - run: brew install xcodegen ffmpeg
      - run: python -m pip install -r apps/apple/qa/requirements.txt
      - run: xcodegen generate
        working-directory: apps/tvos
      - name: UI journeys on a new simulator
        run: python scripts/ci-xcode.py tvos ui --only-testing "$ONLY_TESTING" --output-dir "$RUNNER_TEMP/reel-ci/tvos-ui"
      - name: Remove the test simulator and fixtures
        if: always()
        run: python scripts/ci-xcode.py tvos cleanup --output-dir "$RUNNER_TEMP/reel-ci/tvos-ui"
      - name: Keep results after a failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tvos-ui-results
          path: |
            ${{ runner.temp }}/reel-ci/tvos-ui/results
            ${{ runner.temp }}/reel-ci/tvos-ui/logs
          if-no-files-found: warn
          retention-days: 3
